<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StrangerChat | Free & Safe</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        #localVideo { transform: scaleX(-1); border-radius: 12px; }
        .blur-video { filter: blur(20px); }
    </style>
</head>
<body class="bg-zinc-950 text-white h-screen flex flex-col overflow-hidden font-sans">

    <!-- GUEST LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-zinc-950 z-[100] flex flex-col items-center justify-center p-8">
        <h1 class="text-5xl font-black text-indigo-500 mb-2">STRANGER<span class="text-white">CHAT</span></h1>
        <p class="text-zinc-500 mb-8">Enter your name and start chatting!</p>
        
        <div class="w-full max-w-xs space-y-4">
            <input id="userName" type="text" placeholder="Your Name" class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 text-center outline-none focus:border-indigo-500">
            
            <div class="flex gap-2">
                <button onclick="setGender('male')" id="mBtn" class="flex-1 bg-zinc-800 p-4 rounded-2xl border-2 border-transparent">Boy</button>
                <button onclick="setGender('female')" id="fBtn" class="flex-1 bg-zinc-800 p-4 rounded-2xl border-2 border-transparent">Girl</button>
            </div>

            <button id="startBtn" class="w-full bg-indigo-600 py-4 rounded-2xl font-bold text-xl shadow-lg active:scale-95 transition">START CHAT</button>
        </div>
        <p class="mt-6 text-[10px] text-zinc-600">By starting, you agree to not show nudity.</p>
    </div>

    <!-- MAIN INTERFACE -->
    <main class="flex-1 relative flex flex-col bg-black">
        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover bg-zinc-900"></video>
        <video id="localVideo" autoplay muted playsinline class="absolute top-4 right-4 w-24 h-36 border-2 border-indigo-600 shadow-2xl object-cover"></video>

        <!-- TOP BAR -->
        <div class="absolute top-4 left-4 flex flex-col gap-2">
            <div id="aiStatus" class="bg-green-600 text-[10px] px-2 py-1 rounded font-bold uppercase w-fit">AI Protected</div>
            <button id="reportBtn" class="bg-red-600 text-[10px] px-3 py-1 rounded-full font-bold uppercase w-fit">Report Stranger</button>
        </div>

        <!-- CONTROLS -->
        <div class="p-6 bg-gradient-to-t from-black to-transparent absolute bottom-0 left-0 right-0">
            <div class="flex justify-center gap-2 mb-4">
                <button id="anyFilter" onclick="changeFilter('any')" class="bg-indigo-600 px-6 py-2 rounded-full text-xs font-bold border border-white/10">Any</button>
                <button id="girlFilter" onclick="changeFilter('girl')" class="bg-zinc-900 px-6 py-2 rounded-full text-xs font-bold border border-white/10 text-pink-400">Girls Only</button>
            </div>
            <button id="nextBtn" class="w-full bg-white text-black py-4 rounded-3xl font-black text-2xl shadow-2xl active:scale-95 transition">NEXT</button>
            <p id="status" class="text-center text-[10px] mt-4 text-zinc-500 uppercase tracking-widest">Disconnected</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
