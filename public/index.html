<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StrangerPro | Neon Pink</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; }
        #localVideo { transform: scaleX(-1); border-radius: 15px; border: 2px solid #ec4899; }
        .pink-neon { box-shadow: 0 0 15px #ec4899; }
        .hidden-screen { display: none !important; }
        #chatBox::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="text-white h-screen flex flex-col overflow-hidden font-sans">

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-5xl font-black text-pink-500 mb-2 drop-shadow-[0_0_10px_#ec4899]">STRANGER<span class="text-white">PRO</span></h1>
        <div class="w-full max-w-xs space-y-4 mt-8">
            <input id="userName" type="text" placeholder="Your Name" class="w-full p-4 rounded-2xl bg-zinc-900 border border-pink-500/30 text-center outline-none">
            <div class="flex gap-2">
                <button onclick="setGender('male')" id="mBtn" class="flex-1 bg-pink-600 p-4 rounded-2xl border-2 border-white font-bold">BOY</button>
                <button onclick="setGender('female')" id="fBtn" class="flex-1 bg-zinc-900 p-4 rounded-2xl border-2 border-transparent font-bold">GIRL</button>
            </div>
            <button onclick="handleStart()" class="w-full bg-white text-black py-5 rounded-3xl font-black text-2xl pink-neon">START</button>
        </div>
    </div>

    <!-- 2. MAIN INTERFACE -->
    <main id="chatInterface" class="flex-1 relative flex flex-col hidden-screen">
        <!-- Status & Online -->
        <div class="absolute top-4 left-4 z-50 flex gap-2">
            <div class="bg-pink-600 px-3 py-1 rounded-full text-[10px] font-bold shadow-lg">LIVE</div>
            <div class="bg-black/60 px-3 py-1 rounded-full text-[10px] font-bold border border-pink-500/30"><span id="onlineCount">1</span> ONLINE</div>
        </div>

        <!-- Remote Video -->
        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
        
        <!-- Searching Overlay -->
        <div id="searchingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black z-10">
            <div class="w-12 h-12 border-4 border-pink-500/20 border-t-pink-500 rounded-full animate-spin mb-4"></div>
            <p class="text-pink-500 font-bold text-xs tracking-widest animate-pulse">SEARCHING WORLDWIDE...</p>
        </div>

        <!-- Local Video (Chota) -->
        <video id="localVideo" autoplay muted playsinline class="absolute top-4 right-4 w-24 h-36 z-50 bg-zinc-900 shadow-2xl"></video>

        <!-- Floating Action Buttons (Left Side) -->
        <div class="absolute left-4 top-1/2 -translate-y-1/2 z-50 flex flex-col gap-4">
            <button onclick="toggleMic()" id="micBtn" class="p-3 bg-black/60 border border-pink-500/50 rounded-full text-xl">🎤</button>
            <button onclick="toggleVideo()" id="vidBtn" class="p-3 bg-black/60 border border-pink-500/50 rounded-full text-xl">📷</button>
            <button onclick="switchCamera()" class="p-3 bg-black/60 border border-pink-500/50 rounded-full text-xl">🔄</button>
        </div>

        <!-- Chat Messages (Transparent Overlay) -->
        <div id="chatBox" class="absolute bottom-40 left-4 right-4 h-32 overflow-y-auto z-40 flex flex-col gap-1 pointer-events-none"></div>

        <!-- Controls Container -->
        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black/80 to-transparent z-50 flex flex-col items-center">
            
            <!-- NEXT BUTTON (Thoda Uper) -->
            <button onclick="handleNext()" class="w-full max-w-md bg-pink-600 text-white py-4 rounded-2xl font-black text-xl pink-neon mb-4 active:scale-95 transition-all">
                NEXT STRANGER
            </button>

            <!-- Message Input -->
            <div class="w-full max-w-md flex gap-2">
                <input id="msgInput" type="text" placeholder="Type a message..." class="flex-1 bg-zinc-900 border border-pink-500/30 rounded-full px-5 py-3 outline-none text-sm">
                <button onclick="sendMessage()" class="bg-pink-600 p-3 rounded-full">➔</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
