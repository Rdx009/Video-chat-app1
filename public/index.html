<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StrangerChat | Live Video</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        video { transform: scaleX(-1); } /* Mirror effect for local video */
        #remoteVideo { transform: scaleX(1); } /* Normal for stranger */
    </style>
</head>
<body class="bg-zinc-950 text-white h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900 shadow-md">
        <h1 class="text-2xl font-black text-indigo-500 tracking-tighter">STRANGER<span class="text-white">CHAT</span></h1>
        <div id="status" class="text-xs bg-zinc-800 px-3 py-1 rounded-full text-zinc-400 border border-zinc-700">Initializing...</div>
    </header>

    <!-- Video Grid -->
    <main class="flex-1 flex flex-col p-2 gap-2 overflow-hidden">
        <!-- Remote Video -->
        <div class="relative flex-[2] bg-black rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl">
            <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
            <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest border border-white/10">Stranger</div>
        </div>
        
        <!-- Local Video -->
        <div class="relative flex-1 bg-black rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl">
            <video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
            <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest border border-white/10">You (Camera)</div>
        </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="p-4 bg-zinc-900 border-t border-zinc-800">
        <button id="nextBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all py-4 rounded-2xl font-black text-xl shadow-[0_0_20px_rgba(79,70,229,0.4)]">
            FIND STRANGER
        </button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
