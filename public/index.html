<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StrangerChat Pro</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #localVideo { transform: scaleX(-1); border-radius: 12px; }
        .hidden-screen { display: none !important; }
        
        /* LIVE Blinking Animation */
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* Searching Text Animation */
        .searching-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body class="bg-zinc-950 text-white h-screen flex flex-col overflow-hidden font-sans">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-zinc-950 z-[100] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-black text-indigo-500 mb-2">STRANGER<span class="text-white">CHAT</span></h1>
        <div class="w-full max-w-xs space-y-4">
            <input id="userName" type="text" placeholder="Your Name" class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 text-center outline-none">
            <div class="flex gap-2">
                <button onclick="setGender('male')" id="mBtn" class="flex-1 bg-indigo-600 p-4 rounded-2xl border-2 border-white">Boy</button>
                <button onclick="setGender('female')" id="fBtn" class="flex-1 bg-zinc-800 p-4 rounded-2xl border-2 border-transparent">Girl</button>
            </div>
            <button id="startBtn" onclick="handleStart()" class="w-full bg-white text-black py-4 rounded-2xl font-bold text-xl shadow-lg active:scale-95 transition">START</button>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <main id="chatInterface" class="flex-1 relative flex flex-col bg-black hidden-screen">
        <!-- Header with Live and Online Count -->
        <div class="absolute top-4 left-4 z-50 flex items-center gap-3">
            <div class="flex items-center gap-1.5 bg-red-600 px-3 py-1 rounded-full text-[10px] font-bold">
                <div class="w-2 h-2 bg-white rounded-full blink"></div> LIVE
            </div>
            <div class="bg-zinc-800/80 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold border border-white/10">
                <span id="onlineCount">1</span> ONLINE
            </div>
        </div>

        <!-- Searching Overlay (Sirf tab dikhega jab stranger na ho) -->
        <div id="searchingOverlay" class="absolute inset-0 flex flex-col items-center justify-center z-10">
            <div class="w-20 h-20 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
            <p class="searching-text text-indigo-400 font-bold tracking-widest text-sm uppercase">Searching Worldwide...</p>
        </div>

        <!-- Video Area -->
        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover relative z-20"></video>
        <video id="localVideo" autoplay muted playsinline class="absolute top-4 right-4 w-28 h-40 border-2 border-indigo-600 shadow-2xl object-cover z-50"></video>

        <!-- Controls -->
        <div class="p-6 bg-gradient-to-t from-black via-black/80 to-transparent absolute bottom-0 left-0 right-0 z-50">
            <div class="flex justify-center gap-2 mb-4">
                <button onclick="changeFilter('any')" id="anyFilter" class="bg-indigo-600 px-6 py-2 rounded-full text-[10px] font-bold">Any</button>
                <button onclick="changeFilter('girl')" id="girlFilter" class="bg-zinc-900 px-6 py-2 rounded-full text-[10px] font-bold text-pink-400">Girls Only</button>
            </div>
            <button id="nextBtn" onclick="handleNext()" class="w-full bg-white text-black py-4 rounded-3xl font-black text-2xl shadow-2xl active:scale-95 transition-all">NEXT</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
