<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StrangerChat Pro</title>
    
    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        #localVideo { transform: scaleX(-1); border-radius: 12px; background: #222; }
        video { background-color: #000; }
        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="bg-zinc-950 text-white h-screen flex flex-col overflow-hidden font-sans text-base">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-zinc-950 z-[100] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-black text-indigo-500 mb-2">STRANGER<span class="text-white">CHAT</span></h1>
        <p class="text-zinc-500 mb-8 text-sm italic">Connect with people instantly</p>
        
        <div class="w-full max-w-xs space-y-4">
            <input id="userName" type="text" placeholder="Enter Your Name" class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 text-center outline-none focus:border-indigo-500 text-white">
            
            <div class="flex gap-2">
                <button type="button" onclick="setGender('male')" id="mBtn" class="flex-1 bg-indigo-600 p-4 rounded-2xl border-2 border-white">Boy</button>
                <button type="button" onclick="setGender('female')" id="fBtn" class="flex-1 bg-zinc-800 p-4 rounded-2xl border-2 border-transparent">Girl</button>
            </div>

            <button type="button" id="startBtn" onclick="handleStart()" class="w-full bg-white text-black py-4 rounded-2xl font-bold text-xl shadow-lg active:scale-95 transition">START CHATTING</button>
        </div>
        <p class="mt-6 text-[10px] text-zinc-600">No Nudity Allowed. Be Respectful.</p>
    </div>

    <!-- MAIN INTERFACE -->
    <main id="chatInterface" class="flex-1 relative flex flex-col bg-black hidden-screen">
        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
        <video id="localVideo" autoplay muted playsinline class="absolute top-4 right-4 w-28 h-40 border-2 border-indigo-600 shadow-2xl object-cover"></video>

        <div class="p-6 bg-gradient-to-t from-black to-transparent absolute bottom-0 left-0 right-0">
            <div class="flex justify-center gap-2 mb-4">
                <button onclick="changeFilter('any')" id="anyFilter" class="bg-indigo-600 px-6 py-2 rounded-full text-xs font-bold">Any</button>
                <button onclick="changeFilter('girl')" id="girlFilter" class="bg-zinc-900 px-6 py-2 rounded-full text-xs font-bold text-pink-400">Girls Only</button>
            </div>
            <button id="nextBtn" onclick="handleNext()" class="w-full bg-white text-black py-4 rounded-3xl font-black text-2xl shadow-2xl">NEXT</button>
            <p id="status" class="text-center text-[10px] mt-4 text-zinc-400 uppercase tracking-widest font-bold">Initializing...</p>
        </div>
    </main>

    <!-- Error Debugger (Mobile par error dikhane ke liye) -->
    <div id="debugLog" class="fixed top-0 left-0 w-full bg-red-600 text-[10px] p-1 text-center hidden"></div>

    <script src="script.js"></script>
</body>
</html>
